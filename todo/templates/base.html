{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>
<body>
<div class="container">
    <div class="navbar">
        {% if user.is_authenticated %}
            Hello, {{ user.username }} | <a href="{% url 'signout' %}">Logout</a>
        {% else %}
            <a href="{% url 'signup' %}">Sign Up</a> | <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>
    {% block content %}{% endblock %}
</div>
</body>
</html>
